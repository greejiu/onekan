name: Enable goal quick add

on:
  push:
    paths:
      - '.github/workflows/enable-goal-quick-add.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wire goal quick add
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path('js/interaction-fixes.js')
          text = loader.read_text()
          marker = 'import "./goal-board-v2.js?v=2";'
          addition = marker + '\nimport "./goal-quick-add.js?v=1";'
          if 'goal-quick-add.js' not in text:
              if marker not in text:
                  raise SystemExit('goal board import marker not found')
              text = text.replace(marker, addition, 1)
              loader.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('./js/interaction-fixes.js?v=20', './js/interaction-fixes.js?v=21')
          index.write_text(text)
          PY
          node --check js/goal-quick-add.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-goal-quick-add.yml
          git add js/interaction-fixes.js index.html
          git commit -m "feat: enable goal quick add"
          git push origin main
