name: Refine management status line

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-management-status-line.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update management status summary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/management-history.js')
          text = path.read_text()

          text = text.replace('link.href = "./css/management-history.css?v=1";', 'link.href = "./css/management-history.css?v=2";', 1)

          old_display = '''function displayDate(value) {
            const parts = parseDate(value);
            if (!parts) return "";
            const currentYear = new Date().getFullYear();
            return `${parts.year === currentYear ? "" : `${parts.year}.`}${parts.month}.${parts.day}`;
          }'''
          new_display = '''function displayDate(value) {
            const parts = parseDate(value);
            if (!parts) return "";
            const currentYear = new Date().getFullYear();
            return `${parts.year === currentYear ? "" : `${parts.year}.`}${parts.month}.${parts.day}`;
          }

          function fullDisplayDate(value) {
            const parts = parseDate(value);
            if (!parts) return "";
            return `${parts.year}.${pad(parts.month)}.${pad(parts.day)}`;
          }

          function repeatSummary(value) {
            const repeat = normalizeRepeat(value);
            if (!repeat) return "";
            if (repeat.unit === "day") return `${repeat.interval}일마다`;
            if (repeat.unit === "week") return `${repeat.interval}주마다`;
            if (repeat.unit === "month") return repeat.interval === 1 ? "매월" : `${repeat.interval}개월마다`;
            return repeat.interval === 1 ? "매년" : `${repeat.interval}년마다`;
          }

          function dueSummary(value) {
            const targetParts = parseDate(value);
            const todayParts = parseDate(dateKey());
            if (!targetParts || !todayParts) return "";
            const target = new Date(targetParts.year, targetParts.month - 1, targetParts.day, 12);
            const today = new Date(todayParts.year, todayParts.month - 1, todayParts.day, 12);
            const diff = Math.round((target - today) / 86400000);
            if (diff === 0) return "오늘";
            if (diff > 0) return `${diff}일 남음`;
            return `${Math.abs(diff)}일 지남`;
          }'''
          if old_display not in text:
              raise SystemExit('displayDate block not found')
          text = text.replace(old_display, new_display, 1)

          old_summary = '''function summaryMarkup(item) {
            const latest = rowsFor(item.id).at(-1) || null;
            const text = latest
              ? `마지막 ${displayDate(latest.completedDate)}${relativeDate(latest.completedDate) ? ` · ${relativeDate(latest.completedDate)}` : ""}`
              : "기록 없음";
            return `<button class="management-history-summary" data-management-history-open="${esc(item.id)}" type="button">${esc(text)}</button>`;
          }'''
          new_summary = '''function summaryMarkup(item) {
            const latest = rowsFor(item.id).at(-1) || null;
            const parts = [];
            const repeat = repeatSummary(item.repeat);
            if (repeat) parts.push(repeat);
            parts.push(latest ? `마지막 완료 ${fullDisplayDate(latest.completedDate)}` : "아직 완료 기록 없음");
            if (item.nextDate) {
              parts.push(`다음 예정 ${fullDisplayDate(item.nextDate)}`);
              const due = dueSummary(item.nextDate);
              if (due) parts.push(due);
            }
            return `<button class="management-history-summary" data-management-history-open="${esc(item.id)}" type="button">${esc(parts.join(" · "))}</button>`;
          }'''
          if old_summary not in text:
              raise SystemExit('summaryMarkup block not found')
          text = text.replace(old_summary, new_summary, 1)

          old_signature = '''const signature = JSON.stringify([latest?.id || "", latest?.completedDate || "", latest?.completedTime || ""]);'''
          new_signature = '''const signature = JSON.stringify([latest?.id || "", latest?.completedDate || "", latest?.completedTime || "", item.nextDate || "", normalizeRepeat(item.repeat)]);'''
          if old_signature not in text:
              raise SystemExit('history signature not found')
          text = text.replace(old_signature, new_signature, 1)
          path.write_text(text)

          css = Path('css/management-history.css')
          css_text = css.read_text()
          hide_rule = '#page-management .management-item .management-schedule-meta{display:none!important}'
          if hide_rule not in css_text:
              css_text += hide_rule
              css.write_text(css_text)

          loader = Path('js/interaction-fixes.js')
          loader_text = loader.read_text()
          old = 'import "./management-history.js?v=2";'
          new = 'import "./management-history.js?v=3";'
          if old in loader_text:
              loader_text = loader_text.replace(old, new, 1)
              loader.write_text(loader_text)
          elif new not in loader_text:
              raise SystemExit('management-history loader target not found')

          index = Path('index.html')
          index_text = index.read_text()
          old = './js/interaction-fixes.js?v=14'
          new = './js/interaction-fixes.js?v=15'
          if old in index_text:
              index_text = index_text.replace(old, new, 1)
              index.write_text(index_text)
          elif new not in index_text:
              raise SystemExit('outer loader target not found')
          PY
          node --check js/management-history.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/management-history.js css/management-history.css js/interaction-fixes.js index.html
          git commit -m "refine management status summary line"
          git push origin main

# trigger
