name: Existing task picker style fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-existing-task-picker-style.py'
      - '.github/workflows/fix-existing-task-picker-style.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix-existing-task-picker-style.py
      - name: Validate JavaScript
        run: node --check js/project-planning.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/project-planning.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Style existing task picker independently'
          git push
