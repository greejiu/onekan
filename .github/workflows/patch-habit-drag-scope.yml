name: Finalize habit drag scope patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-habit-drag-scope.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump workspace cache version and remove patch workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = './js/unified-workspace.js?v=57'
          new = './js/unified-workspace.js?v=58'
          if old not in text and new not in text:
              raise SystemExit('Unified workspace script tag not found')
          if old in text:
              text = text.replace(old, new)
              path.write_text(text)
          PY
          git rm .github/workflows/patch-habit-drag-scope.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: refresh habit drag scope behavior"
          git push origin main
