name: Context conversion label patch
on:
  push:
    paths:
      - '.github/workflows/context-convert-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch contextual conversion label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js = Path('js/unified-workspace.js')
          text = js.read_text()
          old = 'menu.innerHTML=\'<button data-c="duplicate">복제</button><button data-c="group">그룹</button>\'+(item.dataset.uwKind!=="habit"?\'<button data-c="convert">할일·일정 전환</button>\':\'\')+\'<button class="danger" data-c="delete">삭제</button>\';'
          new = 'const convertLabel=item.dataset.uwKind==="task"?"일정으로 바꾸기":item.dataset.uwKind==="event"?"할일로 바꾸기":null;menu.innerHTML=\'<button data-c="duplicate">복제</button><button data-c="group">그룹</button>\'+(convertLabel?`<button data-c="convert">${convertLabel}</button>`:\'\')+\'<button class="danger" data-c="delete">삭제</button>\';'
          if old not in text:
              raise SystemExit('target context menu markup not found')
          text = text.replace(old, new, 1)
          js.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          old_ver = './js/unified-workspace.js?v=27'
          new_ver = './js/unified-workspace.js?v=28'
          if old_ver not in html:
              raise SystemExit('unified workspace cache version not found')
          index.write_text(html.replace(old_ver, new_ver, 1))
          PY
      - name: Validate JavaScript
        run: node --check js/unified-workspace.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/context-convert-label.yml
          git add js/unified-workspace.js index.html
          git commit -m 'Clarify task and schedule conversion labels'
          git push
