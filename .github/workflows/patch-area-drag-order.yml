name: Patch area drag order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-area-drag-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/patch-area-drag-order.py
          node --check js/app.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js css/style.css
          git commit -m 'feat: drag to reorder settings areas'
          git push
      - name: Cleanup patch files
        run: |
          git pull --rebase
          rm -f scripts/patch-area-drag-order.py .github/workflows/patch-area-drag-order.yml
          git add -A
          git commit -m 'chore: remove area drag patch files'
          git push
