name: Hide inline task project select

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-inline-task-project-select.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/hide-inline-task-project-select.py
          node --check js/task-input-controls.js
          node --check js/interaction-fixes.js
          git diff --check
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/task-input-controls.js js/interaction-fixes.js index.html
          git commit -m 'ui: hide project selector from task input'
      - name: Remove patch files
        run: |
          git rm scripts/hide-inline-task-project-select.py .github/workflows/hide-inline-task-project-select.yml
          git commit -m 'chore: remove task project input cleanup patch files'
          git push origin main
