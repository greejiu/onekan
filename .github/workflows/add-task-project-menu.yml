name: Add task project menu

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-task-project-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-task-project-menu.py
      - name: Verify JavaScript
        run: |
          node --check js/context-menu.js
          git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/context-menu.js
          git commit -m 'feat: add project field to task menu'
          git rm .github/workflows/add-task-project-menu.yml scripts/patch-task-project-menu.py
          git commit -m 'chore: remove task project menu patch files'
          git push origin main
