name: Add task habit toggle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-task-habit-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply patch
        run: python .github/scripts/add-task-habit-toggle.py

      - name: Check JavaScript syntax
        run: |
          node --check js/context-menu.js
          node --check js/repeat-overview.js

      - name: Commit changes
        run: |
          rm .github/workflows/add-task-habit-toggle.yml
          rm .github/scripts/add-task-habit-toggle.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/context-menu.js js/repeat-overview.js index.html .github/workflows/add-task-habit-toggle.yml .github/scripts/add-task-habit-toggle.py
          git commit -m 'feat: convert recurring tasks to habits'
          git push
