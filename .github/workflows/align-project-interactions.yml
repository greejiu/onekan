name: Align project interactions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch project interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "js/project-status.js",
              'return `<div class="onekan-project-row" draggable="true" data-project-status-id="${esc(project.id)}">',
              'return `<div class="onekan-project-row" draggable="true" data-project-status-id="${esc(project.id)}" data-context-kind="project" data-context-id="${esc(project.id)}">'
          )
          replace_once(
              "js/project-status.js",
              '    event.dataTransfer.setData("text/onekan-project-id", row.dataset.projectStatusId);\n    row.classList.add("dragging");',
              '    event.dataTransfer.setData("text/onekan-project-id", row.dataset.projectStatusId);\n    window.__onekanSuppressItemClickUntil = Date.now() + 700;\n    row.classList.add("dragging");'
          )
          replace_once(
              "js/project-status.js",
              '  root.addEventListener("dragend", (event) => {\n    event.target.closest("[data-project-status-id]")?.classList.remove("dragging");',
              '  root.addEventListener("dragend", (event) => {\n    window.__onekanSuppressItemClickUntil = Date.now() + 700;\n    event.target.closest("[data-project-status-id]")?.classList.remove("dragging");'
          )
          replace_once(
              "js/project-status.js",
              '    event.preventDefault();\n    clearDropState();\n    if (target.dataset.projectStatusDrop)',
              '    event.preventDefault();\n    window.__onekanSuppressItemClickUntil = Date.now() + 700;\n    clearDropState();\n    if (target.dataset.projectStatusDrop)'
          )

          replace_once(
              "js/context-menu.js",
              '  state.projects = Array.isArray(state.projects) ? state.projects : [];\n  state.sessions = Array.isArray(state.sessions) ? state.sessions : [];',
              '  state.projects = Array.isArray(state.projects) ? state.projects : [];\n  state.projectGroups = Array.isArray(state.projectGroups) ? state.projectGroups : [];\n  state.sessions = Array.isArray(state.sessions) ? state.sessions : [];'
          )
          replace_once(
              "js/context-menu.js",
              '    ".project-row strong",\n    ".template-row > span",',
              '    ".project-row strong",\n    ".onekan-project-title",\n    ".template-row > span",'
          )
          replace_once(
              "js/context-menu.js",
              '    const labels = { task: "할일", event: "일정", timeBlock: "시간 계획", habit: "습관", project: item?.kind === "goal" ? "목표" : "작업", session: "시간 기록" };',
              '    const labels = { task: "할일", event: "일정", timeBlock: "시간 계획", habit: "습관", project: item?.kind === "goal" ? "목표" : "프로젝트", session: "시간 기록" };'
          )
          replace_once(
              "js/context-menu.js",
              '  if (error) throw error;\n  $("#reloadCloudBtn")?.click();\n  return true;',
              '  if (error) throw error;\n  document.dispatchEvent(new CustomEvent("onekan:state-changed", { detail: { source: "context-menu" } }));\n  $("#reloadCloudBtn")?.click();\n  return true;'
          )

          p = Path("js/context-menu.js")
          text = p.read_text()
          render_lines = [
              'function renderGroupChoices(state, target) {',
              '  const menu = $("#globalContextMenu");',
              '  const groupButton = menu?.querySelector(\'[data-context-action="groups"]\');',
              '  const groupList = $("#contextGroupList");',
              '  const item = getItem(state, target);',
              '  const usesProjectGroups = target.kind === "project" && item?.kind === "project";',
              '  const groups = usesProjectGroups',
              '    ? (Array.isArray(state?.projectGroups) ? state.projectGroups : [])',
              '    : (Array.isArray(state?.eventGroups) ? state.eventGroups : []);',
              '  const available = groupable(target.kind) && groups.length > 0;',
              '  if (groupButton) {',
              '    groupButton.classList.toggle("hidden", !available);',
              '    groupButton.innerHTML = `${usesProjectGroups ? "그룹" : "영역"} <span class="context-menu-arrow">›</span>`;',
              '  }',
              '  groupList?.classList.add("hidden");',
              '  if (!available || !groupList) {',
              '    if (groupList) groupList.innerHTML = "";',
              '    return;',
              '  }',
              '  const selectedId = usesProjectGroups ? (item?.projectGroupId || groups[0]?.id) : (item?.groupId || groups[0]?.id);',
              '  groupList.innerHTML = groups.map((group) => `<button type="button" role="menuitemradio" aria-checked="${group.id === selectedId}" data-context-group-id="${escapeAttr(group.id)}"><span class="context-group-dot" style="--group-color:${escapeAttr(group.color || "#8fa9c4")}"></span><span>${escapeAttr(group.name)}</span>${group.id === selectedId ? \'<span class="context-group-check">✓</span>\' : ""}</button>`).join("");',
              '}'
          ]
          text, count = re.subn(r'^function renderGroupChoices\(state, target\) \{.*?^\}', "\n".join(render_lines), text, count=1, flags=re.S | re.M)
          if count != 1:
              raise SystemExit("renderGroupChoices patch failed")

          change_lines = [
              'async function changeTargetGroup(groupId) {',
              '  const target = currentTarget;',
              '  hideMenu();',
              '  if (!target || !groupable(target.kind) || !groupId) return;',
              '  try {',
              '    await writeState((state) => {',
              '      const item = getItem(state, target);',
              '      if (!item) return;',
              '      if (target.kind === "project" && item.kind === "project") {',
              '        if (!state.projectGroups?.some((group) => group.id === groupId)) return;',
              '        item.projectGroupId = groupId;',
              '      } else {',
              '        if (!state.eventGroups?.some((group) => group.id === groupId)) return;',
              '        item.groupId = groupId;',
              '      }',
              '    });',
              '  } catch (error) {',
              '    console.error(error);',
              '    showToast(target.kind === "project" ? "그룹을 변경하지 못했어요." : "영역을 변경하지 못했어요.");',
              '  }',
              '}'
          ]
          text, count = re.subn(r'^async function changeTargetGroup\(groupId\) \{.*?^\}', "\n".join(change_lines), text, count=1, flags=re.S | re.M)
          if count != 1:
              raise SystemExit("changeTargetGroup patch failed")
          p.write_text(text)

          p = Path("index.html")
          text = p.read_text()
          text = re.sub(r'js/context-menu\.js\?v=\d+', 'js/context-menu.js?v=24', text)
          text = re.sub(r'js/project-status\.js\?v=\d+', 'js/project-status.js?v=2', text)
          p.write_text(text)
          PY
      - name: Check JavaScript
        run: |
          node --check js/project-status.js
          node --check js/context-menu.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-project-interactions.yml
          git add js/project-status.js js/context-menu.js index.html
          git commit -m "fix: align project drag and click rules"
          git push
