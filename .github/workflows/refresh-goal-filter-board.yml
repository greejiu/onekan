name: Refresh goal filter board
on:
  push:
    paths:
      - '.github/workflows/refresh-goal-filter-board.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify modules and refresh entry cache
        run: |
          node --check js/goal-group-board.js
          node --check js/goal-status-drag.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('./js/interaction-fixes.js?v=24','./js/interaction-fixes.js?v=25',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-goal-filter-board.yml
          git add index.html
          git commit -m "chore: refresh goal filter board cache"
          git push origin main
