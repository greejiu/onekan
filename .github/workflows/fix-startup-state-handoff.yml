name: Fix startup state handoff
on:
  push:
    paths:
      - '.github/scripts/fix-startup-state-handoff.py'
      - '.github/workflows/fix-startup-state-handoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-startup-state-handoff.py
      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/unified-workspace.js
      - name: Verify
        run: |
          grep -q '__ONEKAN_APP_STATE__' js/app.js
          grep -q 'function adoptSharedState' js/unified-workspace.js
          grep -q 'const previousState=state' js/unified-workspace.js
          grep -q 'event.detail?.state&&adoptSharedState' js/unified-workspace.js
          grep -q 'unified-workspace.js?v=78' index.html
      - name: Remove helpers
        run: rm -f .github/scripts/fix-startup-state-handoff.py .github/workflows/fix-startup-state-handoff.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: hand off loaded state to unified calendars' || exit 0
          git push
