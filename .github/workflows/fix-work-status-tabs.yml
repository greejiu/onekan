name: Fix work status tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-work-status-tabs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix status tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()
          for kind in ('goal', 'project'):
              pattern = re.compile(
                  rf'(\s*<button data-work-kind="{kind}" data-work-status="doing" type="button">하는 중</button>)\s*'
                  rf'<button data-work-kind="{kind}" data-work-status="paused" type="button">보류</button>\s*'
                  rf'(<button data-work-kind="{kind}" data-work-status="done" type="button">완료</button>)'
              )
              replacement = (
                  rf'\1\n'
                  rf'          \2\n'
                  rf'          <button data-work-kind="{kind}" data-work-status="stopped" type="button">중단</button>'
              )
              text, count = pattern.subn(replacement, text)
              if count != 1:
                  raise SystemExit(f'failed to update {kind} tabs: {count}')
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-work-status-tabs.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-work-status-tabs.yml
          git commit -m "Fix goal and work status tab order"
          git push
