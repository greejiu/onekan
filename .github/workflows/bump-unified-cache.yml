name: Bump unified workspace cache
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bump-unified-cache.py'
      - '.github/workflows/bump-unified-cache.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache version
        run: python3 scripts/bump-unified-cache.py
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump unified workspace cache version'
          git push
