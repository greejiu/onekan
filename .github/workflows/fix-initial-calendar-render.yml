name: Fix initial calendar render
on:
  push:
    paths:
      - '.github/workflows/fix-initial-calendar-render.yml'
      - '.github/scripts/fix-initial-calendar-render.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-initial-calendar-render.py
      - name: Syntax check
        run: node --check js/unified-workspace.js
      - name: Verify
        run: |
          grep -q 'renderInitialCalendarShells' js/unified-workspace.js
          grep -q 'queueMicrotask(init)' js/unified-workspace.js
          grep -q 'unified-workspace.js?v=76' index.html
          ! grep -q 'setTimeout(init,300)' js/unified-workspace.js
      - name: Remove helpers
        run: rm -f .github/scripts/fix-initial-calendar-render.py .github/workflows/fix-initial-calendar-render.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render calendars immediately on startup' || exit 0
          git push
