name: Add project status page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-project-status-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wire project page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          nav = '        <button class="nav-item" data-page="tasks" type="button"><span class="nav-icon">✓</span><span class="nav-label">할일</span></button>\n'
          project_nav = '        <button class="nav-item" data-page="projects" type="button"><span class="nav-icon">▦</span><span class="nav-label">프로젝트</span></button>\n'
          if project_nav not in text:
              if nav not in text:
                  raise SystemExit('task nav marker not found')
              text = text.replace(nav, nav + project_nav, 1)
          marker = '      <section class="page" id="page-repeat">\n'
          project_section = ''.join([
              '      <section class="page" id="page-projects">\n',
              '        <div class="page-head"><div><h1 class="page-title">프로젝트 현황</h1></div></div>\n',
              '        <div id="projectStatusRoot"></div>\n',
              '      </section>\n\n',
          ])
          if 'id="page-projects"' not in text:
              if marker not in text:
                  raise SystemExit('repeat page marker not found')
              text = text.replace(marker, project_section + marker, 1)
          script = '  <script type="module" src="./js/repeat-overview.js?v=2"></script>\n'
          project_script = '  <script type="module" src="./js/project-status.js?v=1"></script>\n'
          if project_script not in text:
              if script not in text:
                  raise SystemExit('repeat script marker not found')
              text = text.replace(script, script + project_script, 1)
          path.write_text(text)
          PY

      - name: Check JavaScript syntax
        run: node --check js/project-status.js

      - name: Commit changes
        run: |
          rm .github/workflows/add-project-status-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/project-status.js .github/workflows/add-project-status-page.yml
          git commit -m 'feat: add project status page'
          git push
