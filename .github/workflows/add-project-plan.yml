name: Add project planning tab

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-project-plan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-project-plan.py
      - name: Verify JavaScript
        run: |
          node --check js/project-plan.js
          node --check js/unified-workspace.js
          git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/unified-workspace.js
          git commit -m 'feat: add simple project planning flow'
          git rm .github/workflows/add-project-plan.yml scripts/patch-project-plan.py
          git commit -m 'chore: remove project planning patch files'
          git push origin main
