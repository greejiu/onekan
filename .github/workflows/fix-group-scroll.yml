name: Fix group scroll
on:
  push:
    paths:
      - 'scripts/fix-group-scroll.py'
      - '.github/workflows/fix-group-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply group scroll fix
        run: python3 scripts/fix-group-scroll.py
      - name: Validate JavaScript
        run: node --check js/context-menu.js
      - name: Commit patch
        run: |
          rm -f scripts/fix-group-scroll.py .github/workflows/fix-group-scroll.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/unified-workspace.css js/context-menu.js index.html scripts/fix-group-scroll.py .github/workflows/fix-group-scroll.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix scrolling in group pickers'
          git push origin main
