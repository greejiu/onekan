name: Final state-store migration once

on:
  push:
    branches:
      - refactor/final-state-store-debt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration and cache chain
        env:
          CACHE_BASE: origin/main
        run: node scripts/apply-final-state-store-migration.mjs
      - name: Validate migration
        run: |
          set -euo pipefail
          node --check js/backup-manager.js
          node --check js/time-block-v2-settings.js
          node --check js/tracking-stats.js
          for test in scripts/*-regression.mjs; do node "$test"; done
          node scripts/cache-buster-regression.mjs --check-diff origin/main
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/*.js css/*.css scripts/*.mjs claude/state-store-spec.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: oneKan 상태 직접 접근 debt 제거"
          git push origin HEAD:refactor/final-state-store-debt
