name: Remove work linking

on:
  push:
    paths:
      - .github/workflows/remove-work-linking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove linking UI and logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label} not found')
              return text

          work_path = Path('js/work-management.js')
          work = work_path.read_text()

          work = sub_once(
              work,
              r'''  for \(const task of current\.tasks\) \{\n    if \(task\.projectId && !current\.projects\.some\(.*?\)\) delete task\.projectId;\n    if \(task\.goalId && !current\.projects\.some\(.*?\)\) delete task\.goalId;\n  \}''',
              '''  for (const item of current.projects) delete item.goalId;
          for (const task of current.tasks) {
            delete task.projectId;
            delete task.goalId;
          }''',
              'legacy link cleanup',
              re.S,
          )

          work = sub_once(
              work,
              r'''function workTasks\(item\) \{.*?\n\}\n\nfunction progressOf\(item\) \{.*?\n\}''',
              '''function progressOf(item) {
            return Math.max(0, Math.min(100, Number(item.progress || 0)));
          }''',
              'linked progress block',
              re.S,
          )

          work = sub_once(
              work,
              r'''function linkMarkup\(item\) \{.*?\n\}\n\nfunction workRow''',
              'function workRow',
              'link markup',
              re.S,
          )
          work = work.replace('${linkMarkup(item)}</article>', '</article>')

          work = sub_once(
              work,
              r'''function fillDialogOptions\(kind, item = null\) \{.*?\n\}\n\nfunction openDialog''',
              '''function fillDialogOptions() {
            $("#projectGroup").innerHTML = state.eventGroups.map((group) => `<option value="${group.id}">${esc(group.name)}</option>`).join("");
          }

          function openDialog''',
              'goal picker options',
              re.S,
          )
          work = work.replace('  $("#projectGoal").value = item?.goalId || "";\n', '')
          work = work.replace('      if (kind === "project") item.goalId = $("#projectGoal").value || null;\n      else delete item.goalId;', '      delete item.goalId;')

          work_path.write_text(work)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = sub_once(
              index,
              r'''\n      <div class="field" id="projectGoalField"><label>연결 목표</label><select id="projectGoal"><option value="">연결 안 함</option></select></div>''',
              '',
              'project goal field',
          )
          old_progress = '<div class="field"><label>수동 진행률</label><input id="projectProgress" type="number" min="0" max="100" value="0" /><small>연결된 할일이 있으면 완료율이 자동 적용됩니다.</small></div>'
          new_progress = '<div class="field"><label>진행률</label><input id="projectProgress" type="number" min="0" max="100" value="0" /><small>0~100 사이에서 직접 입력합니다.</small></div>'
          if old_progress not in index:
              raise SystemExit('progress helper text not found')
          index = index.replace(old_progress, new_progress)
          if './js/work-management.js?v=3' not in index:
              raise SystemExit('work-management version not found')
          index = index.replace('./js/work-management.js?v=3', './js/work-management.js?v=4')
          index_path.write_text(index)
          PY

          node --check js/work-management.js
          rm .github/workflows/remove-work-linking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove work item linking UI and behavior"
          git push
