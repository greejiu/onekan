name: Fix home card scroll with explicit height
on:
  push:
    paths:
      - '.github/scripts/fix-home-scroll-explicit-height.py'
      - '.github/workflows/fix-home-scroll-explicit-height.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-home-scroll-explicit-height.py
      - name: Verify
        run: |
          grep -q 'Home right cards: explicit-height internal scrolling' css/unified-workspace.css
          grep -q 'function clearHomeRightSizing' js/unified-workspace.js
          grep -q 'body.style.height=' js/unified-workspace.js
          grep -q 'addEventListener("toggle",syncHomeColumnHeight)' js/unified-workspace.js
          grep -q 'unified-workspace.css?v=58' index.html
          grep -q 'unified-workspace.js?v=84' index.html
      - name: Remove helpers
        run: rm -f .github/scripts/fix-home-scroll-explicit-height.py .github/workflows/fix-home-scroll-explicit-height.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore home card internal scrolling' || exit 0
          git push
