name: Fix upcoming card scroll
on:
  push:
    paths:
      - '.github/scripts/fix-upcoming-scroll.py'
      - '.github/workflows/fix-upcoming-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-upcoming-scroll.py
      - name: Verify
        run: |
          grep -q 'Home right cards: reliable half-height internal scrolling' css/unified-workspace.css
          grep -q 'flex:1 1 auto;' css/unified-workspace.css
          grep -q 'overflow-y:auto;' css/unified-workspace.css
          grep -q 'unified-workspace.css?v=54' index.html
      - name: Remove helpers
        run: rm -f .github/scripts/fix-upcoming-scroll.py .github/workflows/fix-upcoming-scroll.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore scrolling through full upcoming range' || exit 0
          git push
