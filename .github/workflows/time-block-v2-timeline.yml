name: Time block V2 timeline
on:
  push:
    paths:
      - 'scripts/patch-time-block-v2-timeline.py'
      - 'scripts/time-block-v2-timeline-regression.mjs'
      - '.github/workflows/time-block-v2-timeline.yml'

permissions:
  contents: write

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply timeline patch
        run: python scripts/patch-time-block-v2-timeline.py
      - name: Check JavaScript
        run: |
          node --check js/time-block-v2.js
          node --check js/unified-workspace.js
      - name: Run timeline regression
        run: node scripts/time-block-v2-timeline-regression.mjs
      - name: Verify cache bumps
        run: |
          grep -q 'unified-workspace.css?v=35' index.html
          grep -q 'unified-workspace.js?v=41' index.html
      - name: Commit timeline projection
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/time-block-v2.js js/unified-workspace.js css/unified-workspace.css index.html
          git commit -m 'Project time block plans onto home timeline'
          git push
