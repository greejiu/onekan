name: Refresh management home

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-management-home.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate management home module
        run: node --check js/management-home.js
      - name: Bump interaction loader and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = './js/interaction-fixes.js?v=10'
          new = './js/interaction-fixes.js?v=11'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Expected interaction-fixes loader not found')
          PY
          git rm .github/workflows/refresh-management-home.yml
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: load management home integration"
          git push origin main

# trigger
