name: Finalize management home isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-management-home-isolation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh loader and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = './js/interaction-fixes.js?v=11'
          new = './js/interaction-fixes.js?v=12'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('interaction loader not found')
          PY
          git rm .github/workflows/fix-management-home-isolation.yml
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: refresh isolated management home integration"
          git push origin main
