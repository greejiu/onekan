name: Enable management checklists

on:
  push:
    paths:
      - '.github/workflows/enable-management-checklists.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable checklist module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/interaction-fixes.js')
          text = p.read_text()
          needle = 'import "./management-items.js?v=5";\n'
          addition = needle + 'import "./management-checklist.js?v=1";\n'
          if 'management-checklist.js' not in text:
              if needle not in text:
                  raise SystemExit('management-items import not found')
              text = text.replace(needle, addition, 1)
          p.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('./js/interaction-fixes.js?v=28', './js/interaction-fixes.js?v=29', 1)
          index.write_text(html)
          PY
          node --check js/management-checklist.js
          node --check js/interaction-fixes.js
      - name: Commit checklist enablement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-management-checklists.yml
          git add js/interaction-fixes.js index.html
          git commit -m "feat: enable management checklists"
          git push origin main
