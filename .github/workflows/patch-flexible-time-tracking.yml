name: Patch flexible time tracking

on:
  push:
    paths:
      - '.github/workflows/patch-flexible-time-tracking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch time tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('js/app.js')
          text = app_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'timer: { mode: "pomodoro", running: false, paused: false, taskId: null, startedAt: null, accumulatedMs: 0, durationMs: 25 * 60 * 1000 },',
              'timer: { mode: "pomodoro", running: false, paused: false, taskId: null, title: null, startedAt: null, accumulatedMs: 0, durationMs: 25 * 60 * 1000 },',
              'default timer title')

          replace_once(
              'state.sessions.push({ id: uid(), taskId: timer.taskId, title: task?.title || "집중 기록", start: new Date(Date.now() - duration).toISOString(), end: new Date().toISOString(), durationMs: duration, timerMode: mode });',
              'state.sessions.push({ id: uid(), taskId: timer.taskId || null, title: task?.title || timer.title || "집중 기록", start: new Date(Date.now() - duration).toISOString(), end: new Date().toISOString(), durationMs: duration, timerMode: mode });',
              'timer session title')

          replace_once(
              'state.timer = { mode, running: false, paused: false, taskId: null, startedAt: null, accumulatedMs: 0, durationMs };',
              'state.timer = { mode, running: false, paused: false, taskId: null, title: null, startedAt: null, accumulatedMs: 0, durationMs };',
              'timer reset title')

          replace_once(
              '      <label><span>할일 연결</span><select id="manualSessionTask"><option value="">연결 안 함</option></select></label>\n',
              '',
              'remove manual task link field')

          pattern = re.compile(r'''  \$\("#manualSessionTask", dialog\)\.addEventListener\("change", \(event\) => \{\n    const task = state\.tasks\.find\(\(item\) => item\.id === event\.target\.value\);\n    const title = \$\("#manualSessionTitle", dialog\);\n    if \(task && !title\.value\.trim\(\)\) title\.value = task\.title;\n  \}\);\n''')
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'remove manual task change handler: expected 1 match, got {count}')

          replace_once(
              '      taskId: $("#manualSessionTask", dialog).value || null,',
              '      taskId: null,',
              'manual session task id')

          replace_once(
              '  $("#manualSessionTask", dialog).innerHTML = \'<option value="">연결 안 함</option>\' + state.tasks.map((task) => `<option value="${task.id}">${esc(task.title)}</option>`).join("");\n',
              '',
              'remove manual task options')

          start = text.index('function renderTracking() {')
          end = text.index('\nfunction renderProjects()', start)
          if start < 0 or end < 0:
              raise SystemExit('renderTracking boundaries not found')
          text = text[:start] + '''function renderTracking() {\n  const select = $("#timerTaskSelect");\n  const custom = $("#timerCustomTitle");\n  const previous = select.value;\n  const previousCustom = custom?.value || "";\n  const dayKey = appDayKey();\n  const activeTasks = state.tasks.filter((task) => recurringOnDate(task, dayKey) && !taskCompletedOn(task, dayKey));\n  select.innerHTML = '<option value="">오늘 할일 선택 (선택 안 해도 됨)</option>' + activeTasks.map((task) => `<option value="${task.id}">${esc(task.title)}</option>`).join("");\n  if (activeTasks.some((task) => task.id === previous)) select.value = previous;\n  if (state.timer.taskId) select.value = state.timer.taskId;\n  if (custom) custom.value = state.timer.running ? (state.timer.taskId ? "" : (state.timer.title || "")) : previousCustom;\n  const task = state.tasks.find((item) => item.id === state.timer.taskId);\n  const directTitle = custom?.value.trim() || "";\n  $("#timerTaskLabel").textContent = task?.title || state.timer.title || directTitle || "할일을 선택하거나 직접 기록 이름을 써도 돼요.";\n  updateTimerUI();\n  renderSessions();\n}\n''' + text[end:]

          replace_once(
              '  $("#timerPlusMinute").disabled = timer.running;',
              '  $("#timerPlusMinute").disabled = timer.running;\n  $("#timerTaskSelect").disabled = timer.running;\n  if ($("#timerCustomTitle")) $("#timerCustomTitle").disabled = timer.running;',
              'disable tracking inputs while running')

          old_start = '''  $("#timerStart").addEventListener("click", () => {\n    const taskId = $("#timerTaskSelect").value;\n    if (!taskId) return window.alert("먼저 할일을 골라 주세요.");\n    state.timer = { mode: timerMode(), running: true, paused: false, taskId, startedAt: Date.now(), accumulatedMs: 0, durationMs: timerDurationMs() };\n    save();\n    renderTracking();\n    startTicker();\n  });'''
          new_start = '''  $("#timerStart").addEventListener("click", () => {\n    const taskId = $("#timerTaskSelect").value || null;\n    const task = taskId ? state.tasks.find((item) => item.id === taskId) : null;\n    const customTitle = $("#timerCustomTitle")?.value.trim() || "";\n    const title = task?.title || customTitle;\n    if (!title) return window.alert("할일을 선택하거나 기록 이름을 입력해 주세요.");\n    state.timer = { mode: timerMode(), running: true, paused: false, taskId, title, startedAt: Date.now(), accumulatedMs: 0, durationMs: timerDurationMs() };\n    save();\n    renderTracking();\n    startTicker();\n  });'''
          replace_once(old_start, new_start, 'flexible timer start')

          old_change = '''  $("#timerTaskSelect").addEventListener("change", () => {\n    const task = state.tasks.find((item) => item.id === $("#timerTaskSelect").value);\n    $("#timerTaskLabel").textContent = task ? task.title : "할일을 고르고 시작하세요.";\n  });'''
          new_change = '''  $("#timerTaskSelect").addEventListener("change", () => {\n    const task = state.tasks.find((item) => item.id === $("#timerTaskSelect").value);\n    if (task && $("#timerCustomTitle")) $("#timerCustomTitle").value = "";\n    $("#timerTaskLabel").textContent = task?.title || $("#timerCustomTitle")?.value.trim() || "할일을 선택하거나 직접 기록 이름을 써도 돼요.";\n  });\n  $("#timerCustomTitle")?.addEventListener("input", (event) => {\n    if (event.target.value.trim()) $("#timerTaskSelect").value = "";\n    $("#timerTaskLabel").textContent = event.target.value.trim() || "할일을 선택하거나 직접 기록 이름을 써도 돼요.";\n  });'''
          replace_once(old_change, new_change, 'tracking choice listeners')

          app_path.write_text(text)

          index_path = Path('index.html')
          html = index_path.read_text()
          old_html = '              <div class="field timer-select"><label>집중할 오늘 할일</label><select id="timerTaskSelect"></select></div>'
          new_html = '              <div class="field timer-select"><label>기록할 내용</label><select id="timerTaskSelect"></select><input id="timerCustomTitle" type="text" maxlength="80" placeholder="또는 직접 기록 이름 입력" autocomplete="off" /></div>'
          if html.count(old_html) != 1:
              raise SystemExit(f'tracking input markup: expected 1 match, got {html.count(old_html)}')
          html = html.replace(old_html, new_html, 1)
          if html.count('./js/app.js?v=29') != 1:
              raise SystemExit('app cache version marker not found exactly once')
          html = html.replace('./js/app.js?v=29', './js/app.js?v=30', 1)
          index_path.write_text(html)
          PY
          node --check js/app.js
      - name: Commit changes
        run: |
          rm .github/workflows/patch-flexible-time-tracking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow standalone time tracking records"
          git push
