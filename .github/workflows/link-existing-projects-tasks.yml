name: Existing item linking patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/link-existing-projects-tasks.py'
      - '.github/workflows/link-existing-projects-tasks.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/link-existing-projects-tasks.py
      - name: Validate JavaScript
        run: |
          node --check js/work-management.js
          node --check js/project-planning.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/work-management.js js/project-planning.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Allow linking existing projects and tasks'
          git push
