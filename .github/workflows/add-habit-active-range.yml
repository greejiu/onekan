name: Habit active range patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-habit-active-range.py'
      - '.github/workflows/add-habit-active-range.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/add-habit-active-range.py
      - name: Validate JavaScript
        run: node --check js/unified-workspace.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/unified-workspace.js css/unified-workspace.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add habit start and end dates'
          git push
