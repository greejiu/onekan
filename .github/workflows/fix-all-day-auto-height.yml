name: Fix all-day panel auto height

on:
  push:
    paths:
      - '.github/workflows/fix-all-day-auto-height.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch all-day layout
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('css/unified-workspace.css')
          css = css_path.read_text()
          old = '.uw-all-day{position:relative;height:88px;box-sizing:border-box;padding:5px 6px;border-bottom:1px solid var(--line);background:var(--panel-soft);overflow:visible}'
          new = '.uw-all-day{position:relative;height:auto;min-height:88px;box-sizing:border-box;padding:5px 6px;border-bottom:1px solid var(--line);background:var(--panel-soft);overflow:visible}.uw-all-day:has(.uw-all-day-more){padding-bottom:20px}'
          if css.count(old) != 1:
              raise SystemExit(f'all-day base: expected 1 match, got {css.count(old)}')
          css = css.replace(old, new, 1)

          old_pop = '.uw-all-day-popover{position:absolute;top:82px;right:5px;left:5px;z-index:30;display:none;max-height:300px;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 12px 30px #0002;overflow-y:auto}'
          new_pop = '.uw-all-day-popover{position:absolute;top:calc(100% - 4px);right:5px;left:5px;z-index:30;display:none;max-height:300px;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 12px 30px #0002;overflow-y:auto}'
          if css.count(old_pop) != 1:
              raise SystemExit(f'all-day popover: expected 1 match, got {css.count(old_pop)}')
          css = css.replace(old_pop, new_pop, 1)
          css_path.write_text(css)

          index_path = Path('index.html')
          html = index_path.read_text()
          old_cache = './css/unified-workspace.css?v=21'
          new_cache = './css/unified-workspace.css?v=22'
          if html.count(old_cache) != 1:
              raise SystemExit(f'css cache: expected 1 match, got {html.count(old_cache)}')
          html = html.replace(old_cache, new_cache, 1)
          index_path.write_text(html)
          PY
      - name: Commit changes
        run: |
          git rm .github/workflows/fix-all-day-auto-height.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Let all-day panels grow with visible items"
          git push
