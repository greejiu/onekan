name: Restore task and event repeat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-task-event-repeat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore repeat for tasks and events only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('js/app.js')
          text = app.read_text()
          old = '  if (window.__ONEKAN_DAILY_FOCUS_MODE__) return item?.date === targetKey;\n'
          if old not in text:
              raise SystemExit('app recurrence guard not found')
          app.write_text(text.replace(old, '', 1))

          unified = Path('js/unified-workspace.js')
          text = unified.read_text()
          old = '  if(window.__ONEKAN_DAILY_FOCUS_MODE__)return targetDate===baseDate;\n'
          if old not in text:
              raise SystemExit('unified recurrence guard not found')
          unified.write_text(text.replace(old, '', 1))

          focus = Path('js/daily-focus-mode.js')
          text = focus.read_text()
          text, count = re.subn(r'\nconst REPEAT_CONTROL_SELECTORS = \[.*?\n\];\n', '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('repeat selector block not found')
          text, count = re.subn(r'\nfunction removeRepeatControls\(root = document\) \{.*?\n\}\n\nfunction cleanTracking', '\nfunction cleanTracking', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('repeat control cleanup function not found')
          old = '  removeRepeatControls(root);\n'
          if old not in text:
              raise SystemExit('repeat cleanup call not found')
          focus.write_text(text.replace(old, '', 1))

          index = Path('index.html')
          text = index.read_text()
          replacements = {
              './js/app.js?v=39': './js/app.js?v=40',
              './js/unified-workspace.js?v=63': './js/unified-workspace.js?v=64',
              './js/daily-focus-mode.js?v=2': './js/daily-focus-mode.js?v=3',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'cache token not found: {old}')
              text = text.replace(old, new, 1)
          index.write_text(text)
          PY

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/unified-workspace.js
          node --check js/daily-focus-mode.js

      - name: Commit changes
        run: |
          rm .github/workflows/restore-task-event-repeat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js js/unified-workspace.js js/daily-focus-mode.js .github/workflows/restore-task-event-repeat.yml
          git commit -m 'feat: keep repeat for tasks and events only'
          git push
