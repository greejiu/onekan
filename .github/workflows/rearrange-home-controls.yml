name: Home controls patch

on:
  push:
    paths:
      - '.github/workflows/rearrange-home-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-home-controls.py
      - name: Validate JavaScript
        run: node --check js/unified-workspace.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rearrange-home-controls.yml .github/patch-home-controls.py
          git add index.html js/unified-workspace.js css/unified-workspace.css
          git commit -m "Move home navigation into two rows"
          git push
