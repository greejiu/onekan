name: Polish home planner card
on:
  push:
    paths:
      - '.github/scripts/polish-home-planner-card.py'
      - '.github/workflows/polish-home-planner-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/polish-home-planner-card.py
      - name: Verify
        run: |
          grep -q 'gap:0;' css/unified-workspace.css
          grep -q 'border-radius:23px 23px 0 0' css/unified-workspace.css
          grep -q 'Home planner card polish' css/unified-workspace.css
          grep -q 'unified-workspace.css?v=46' index.html
      - name: Remove helpers
        run: rm -f .github/scripts/polish-home-planner-card.py .github/workflows/polish-home-planner-card.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: polish home planner card header' || exit 0
          git push
