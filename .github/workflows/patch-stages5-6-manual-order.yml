name: Patch stages 5 and 6 manual order

on:
  push:
    paths:
      - '.github/workflows/patch-stages5-6-manual-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: node .github/scripts/patch-stages5-6-manual-order.mjs
      - name: Check JavaScript
        run: |
          node --check js/unified-workspace.js
          node --check js/repeat-overview.js
          node --check js/manual-list-order.js
      - name: Check diff
        run: git diff --check
      - name: Commit feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/unified-workspace.js js/repeat-overview.js
          git commit -m "feat: add shared manual ordering to lists"
          git push
      - name: Remove patch files
        run: |
          git rm .github/workflows/patch-stages5-6-manual-order.yml .github/scripts/patch-stages5-6-manual-order.mjs
          git commit -m "chore: remove manual order patch files"
          git push
