name: Fix timeline repeat and drag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-repeat-timeline-drag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch repeat popover and empty timeline drops
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Keep task/event repeat controls usable inside timeline/time-block surfaces.
          path = Path('js/task-input-controls.js')
          text = path.read_text()
          old = '''  repeatButton.addEventListener("click",()=>{\n    if(!form.dataset.uwTaskSelectedDate){const d=todayKey();form.dataset.uwTaskSelectedDate=d;form.dataset.uwEntrySelectedDate=d;dateInput.value=d}\n    panel.hidden=!panel.hidden;repeatButton.setAttribute("aria-expanded",String(!panel.hidden));updateState()\n  });'''
          new = '''  const positionRepeatPanel=()=>{\n    if(panel.hidden)return;\n    if(!form.closest(".uw-timeline,.uw-time-block-v2-section")){panel.removeAttribute("style");return}\n    const rect=repeatButton.getBoundingClientRect(),width=Math.min(330,Math.max(240,window.innerWidth-24));\n    const left=Math.max(12,Math.min(rect.right-width,window.innerWidth-width-12));\n    panel.style.position="fixed";panel.style.width=`${width}px`;panel.style.left=`${left}px`;panel.style.right="auto";panel.style.bottom="auto";panel.style.zIndex="12050";panel.style.visibility="hidden";\n    panel.style.top=`${Math.min(window.innerHeight-12,rect.bottom+6)}px`;\n    requestAnimationFrame(()=>{if(panel.hidden)return;const height=panel.getBoundingClientRect().height;const below=rect.bottom+6,above=rect.top-height-6;panel.style.top=`${below+height<=window.innerHeight-12?below:Math.max(12,above)}px`;panel.style.visibility=""})\n  };\n  repeatButton.addEventListener("click",()=>{\n    if(!form.dataset.uwTaskSelectedDate){const d=todayKey();form.dataset.uwTaskSelectedDate=d;form.dataset.uwEntrySelectedDate=d;dateInput.value=d}\n    panel.hidden=!panel.hidden;repeatButton.setAttribute("aria-expanded",String(!panel.hidden));updateState();\n    if(!panel.hidden)positionRepeatPanel();else panel.removeAttribute("style")\n  });'''
          if old not in text:
              raise SystemExit('task repeat click token not found')
          text = text.replace(old, new, 1)
          style_old = '''    .uw-task-repeat-pop[hidden]{display:none!important}\n    .uw-task-repeat-pop>.uw-repeat-select{width:100%}'''
          style_new = '''    .uw-task-repeat-pop[hidden]{display:none!important}\n    .uw-inline-form.uw-task-compact-input:has(.uw-task-repeat-pop:not([hidden])){z-index:12040!important;overflow:visible!important}\n    .uw-time-block-v2-section:has(.uw-task-repeat-pop:not([hidden])){overflow:visible!important;position:relative;z-index:12030}\n    .uw-task-repeat-pop{pointer-events:auto}\n    .uw-task-repeat-pop>.uw-repeat-select{width:100%}'''
          if style_old not in text:
              raise SystemExit('task repeat style token not found')
          path.write_text(text.replace(style_old, style_new, 1))

          # 2) Untimed/planning items may leave a named time block and be dropped onto an exact empty timeline slot.
          path = Path('js/unified-workspace.js')
          text = path.read_text()
          old = '''      const minute=START+((clientY-rect.top)/SLOT_H)*SLOT,templates=effectiveTimeBlockTemplatesForDate(state,date),block=templates.find(candidate=>minute>=Number(candidate.startMinute)&&minute<Number(candidate.endMinute));\n      if(!block)return null;'''
          new = '''      const minute=START+((clientY-rect.top)/SLOT_H)*SLOT,snappedMinute=minuteAt(lane,clientY),templates=effectiveTimeBlockTemplatesForDate(state,date),block=templates.find(candidate=>minute>=Number(candidate.startMinute)&&minute<Number(candidate.endMinute));\n      if(!block){\n        timeline.querySelector(`.uw-time-hit[data-time="${snappedMinute}"]`)?.classList.add("uw-drop-target");\n        return{dropType:"time",date,startMinute:snappedMinute}\n      }'''
          if old not in text:
              raise SystemExit('timeline block gate token not found')
          text = text.replace(old, new, 1)
          old = '''      g.dropType=target?.dropType||null;\n      g.nextDate=target?.date||g.date;\n      g.nextBlockId=target?.blockId||null;'''
          new = '''      g.dropType=target?.dropType||null;\n      g.nextDate=target?.date||g.date;\n      if(target?.dropType==="time"&&Number.isFinite(Number(target.startMinute)))g.nextStart=Number(target.startMinute);\n      g.nextBlockId=target?.blockId||null;'''
          if old not in text:
              raise SystemExit('timeline target assignment token not found')
          path.write_text(text.replace(old, new, 1))

          # 3) Cache bust changed modules.
          path = Path('js/interaction-fixes.js')
          text = path.read_text()
          old = '"./task-input-controls.js?v=2"'
          if old not in text:
              raise SystemExit('task input cache token not found')
          path.write_text(text.replace(old, '"./task-input-controls.js?v=3"', 1))

          path = Path('index.html')
          text = path.read_text()
          for old, new in [
              ('./js/interaction-fixes.js?v=34','./js/interaction-fixes.js?v=35'),
              ('./js/unified-workspace.js?v=66','./js/unified-workspace.js?v=67'),
          ]:
              if old not in text:
                  raise SystemExit(f'index cache token not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Check JavaScript syntax
        run: |
          node --check js/task-input-controls.js
          node --check js/unified-workspace.js
          node --check js/interaction-fixes.js

      - name: Commit changes
        run: |
          rm .github/workflows/fix-repeat-timeline-drag.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/task-input-controls.js js/unified-workspace.js js/interaction-fixes.js index.html .github/workflows/fix-repeat-timeline-drag.yml
          git commit -m 'fix: restore timeline repeat and empty-slot drag'
          git push
