name: Finalize goal drag and notes removal

on:
  push:
    paths:
      - '.github/workflows/finalize-goal-drag-remove-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text()
          if './js/interaction-fixes.js?v=22' in text:
              text = text.replace('./js/interaction-fixes.js?v=22', './js/interaction-fixes.js?v=23', 1)
          elif './js/interaction-fixes.js?v=23' not in text:
              raise SystemExit('interaction-fixes cache marker not found')
          index.write_text(text)
          PY
          node --check js/goal-status-drag.js
          node --check js/goal-board-v2.js
          node --check js/goal-quick-add.js
          if grep -q 'notes.js' js/interaction-fixes.js; then
            echo 'notes imports still present' >&2
            exit 1
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-goal-drag-remove-notes.yml
          git add index.html
          git commit -m "chore: refresh app after notes removal"
          git push origin main
