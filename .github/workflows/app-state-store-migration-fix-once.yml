name: App state-store migration fix once

on:
  push:
    branches:
      - chore/app-state-store-direct

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/app-state-store-direct
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fix
        run: node scripts/app-state-store-migration-fix-once.mjs
      - name: Validate migration
        run: |
          node --check js/app.js
          node --check js/state-store.js
          node scripts/state-store-regression.mjs
          node scripts/app-state-store-regression.mjs
          node scripts/runtime-asset-regression.mjs
      - name: Commit fix
        run: |
          git config user.name "greejiu"
          git config user.email "monggreee@naver.com"
          git add -A
          git commit -m "refactor: app 저장을 state-store mutate로 단순화"
          git push origin HEAD:chore/app-state-store-direct
