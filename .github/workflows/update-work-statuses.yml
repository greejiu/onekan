name: Update work statuses

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-work-statuses.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update status labels and goal title
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('js/work-management.js')
          text = js.read_text()
          text = text.replace(
          '''const statusDefs = [
            { id: "before", label: "시작 전", color: "#8fa9c4" },
            { id: "doing", label: "하는 중", color: "#88b49a" },
            { id: "paused", label: "보류", color: "#d0aa72" },
            { id: "done", label: "완료", color: "#a69ab8" },
          ];''',
          '''const statusDefs = [
            { id: "before", label: "시작 전", color: "#8fa9c4" },
            { id: "doing", label: "하는 중", color: "#88b49a" },
            { id: "done", label: "완료", color: "#a69ab8" },
            { id: "stopped", label: "중단", color: "#b89a91" },
          ];''')
          text = text.replace('if (item.status === "보류") item.status = "paused";', 'if (item.status === "paused" || item.status === "보류" || item.status === "중단") item.status = "stopped";')
          js.write_text(text)

          html = Path('index.html')
          text = html.read_text()
          text = text.replace('<span class="nav-label">목표</span>', '<span class="nav-label">목표 현황</span>')
          text = text.replace('<span class="nav-label">작업현황</span>', '<span class="nav-label">작업 현황</span>')
          text = text.replace('<h1 class="page-title">목표</h1>', '<h1 class="page-title">목표 현황</h1>')
          text = text.replace('<h1 class="page-title">작업현황</h1>', '<h1 class="page-title">작업 현황</h1>')
          text = text.replace('''          <button data-work-kind="goal" data-work-status="doing" type="button">하는 중</button>
          <button data-work-kind="goal" data-work-status="paused" type="button">보류</button>
          <button data-work-kind="goal" data-work-status="done" type="button">완료</button>''', '''          <button data-work-kind="goal" data-work-status="doing" type="button">하는 중</button>
          <button data-work-kind="goal" data-work-status="done" type="button">완료</button>
          <button data-work-kind="goal" data-work-status="stopped" type="button">중단</button>''')
          text = text.replace('''          <button data-work-kind="project" data-work-status="doing" type="button">하는 중</button>
          <button data-work-kind="project" data-work-status="paused" type="button">보류</button>
          <button data-work-kind="project" data-work-status="done" type="button">완료</button>''', '''          <button data-work-kind="project" data-work-status="doing" type="button">하는 중</button>
          <button data-work-kind="project" data-work-status="done" type="button">완료</button>
          <button data-work-kind="project" data-work-status="stopped" type="button">중단</button>''')
          text = text.replace('<select id="projectStatus"><option value="before">시작 전</option><option value="doing">하는 중</option><option value="paused">보류</option><option value="done">완료</option></select>', '<select id="projectStatus"><option value="before">시작 전</option><option value="doing">하는 중</option><option value="done">완료</option><option value="stopped">중단</option></select>')
          text = text.replace('./js/work-management.js?v=5', './js/work-management.js?v=6')
          html.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/update-work-statuses.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/work-management.js index.html .github/workflows/update-work-statuses.yml
          git commit -m "Rename work statuses and goal dashboard"
          git push
