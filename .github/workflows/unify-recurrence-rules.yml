name: Recurrence unification patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/unify-recurrence-rules.py'
      - '.github/workflows/unify-recurrence-rules.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/unify-recurrence-rules.py
      - name: Validate JavaScript
        run: |
          node --check js/unified-workspace.js
          node --check js/task-input-controls.js
          node --check js/task-completed-groups.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/unified-workspace.js js/task-input-controls.js js/task-completed-groups.js css/unified-workspace.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Unify recurrence rules across items'
          git push
