name: Flatten management items by section

on:
  push:
    paths:
      - '.github/workflows/flatten-management-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply flat management layout
        run: python .github/scripts/flatten_management.py
      - name: Check JavaScript
        run: |
          node --check js/management.js
          node --check js/management-items.js
          node --check js/management-section-item-drag.js
          node --check js/interaction-fixes.js
      - name: Commit flat management layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/flatten-management-items.yml .github/scripts/flatten_management.py
          git add index.html js/interaction-fixes.js js/management.js js/management-items.js js/management-section-item-drag.js css/management.css css/management-items.css
          git commit -m "feat: flatten management items under sections"
          git push origin main
