name: Move project plans to dialog
on:
  push:
    branches: [main]
    paths:
      - 'scripts/move-project-plans-to-dialog.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply project plan dialog patch
        run: python3 scripts/move-project-plans-to-dialog.py
      - name: Validate JavaScript
        run: node --check js/project-planning.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/unified-workspace.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show project plans only in edit dialog'
          git push
