name: Time tracking groups patch

on:
  push:
    paths:
      - '.github/workflows/session-groups.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patch-session-groups.py
      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/context-menu.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/session-groups.yml .github/patch-session-groups.py
          git add index.html js/app.js js/context-menu.js
          git commit -m "Add groups to time tracking records"
          git push
