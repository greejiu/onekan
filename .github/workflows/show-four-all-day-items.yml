name: Show four all-day items

on:
  push:
    paths:
      - '.github/workflows/show-four-all-day-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Increase all-day visible items
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/unified-workspace.js')
          text = path.read_text()
          old = 'function allDayPanel(k,items){const shown=items.slice(0,2),hidden=items.slice(2),extra=hidden.length;'
          new = 'function allDayPanel(k,items){const shown=items.slice(0,4),hidden=items.slice(4),extra=hidden.length;'
          if text.count(old) != 1:
              raise SystemExit(f'allDayPanel marker expected once, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          index = Path('index.html')
          html = index.read_text()
          old_cache = './js/unified-workspace.js?v=25'
          new_cache = './js/unified-workspace.js?v=26'
          if html.count(old_cache) != 1:
              raise SystemExit(f'cache marker expected once, got {html.count(old_cache)}')
          index.write_text(html.replace(old_cache, new_cache, 1))
          PY
          node --check js/unified-workspace.js
      - name: Commit changes
        run: |
          rm .github/workflows/show-four-all-day-items.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show four all-day items before overflow"
          git push
