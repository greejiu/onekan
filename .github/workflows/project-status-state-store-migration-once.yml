name: Project status state-store migration once

on:
  push:
    branches:
      - refactor/project-status-state-store

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/project-status-state-store
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: node scripts/project-status-state-store-migration-once.mjs
      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -maxdepth 1 -name '*.js' -print0 | sort -z)
          for test in scripts/*-regression.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          node scripts/cache-buster-regression.mjs --check-diff origin/main
          node scripts/unified-render-smoke.mjs
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: project status automation을 공용 state-store로 이전"
          git push origin HEAD:refactor/project-status-state-store
