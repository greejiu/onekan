name: Remove repeat UI

on:
  push:
    paths:
      - '.github/workflows/remove-repeat-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Disable recurrence in daily focus mode
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text()
          old = 'function recurringOnDate(item, targetKey) {\n  if (!item?.date) return false;'
          new = 'function recurringOnDate(item, targetKey) {\n  if (window.__ONEKAN_DAILY_FOCUS_MODE__) return item?.date === targetKey;\n  if (!item?.date) return false;'
          if old not in text and new not in text:
              raise SystemExit('app recurrence target not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          unified = Path('js/unified-workspace.js')
          text = unified.read_text()
          old = 'function recurrenceOn(item,baseDate,targetDate){\n  if(!baseDate||!targetDate)return false;'
          new = 'function recurrenceOn(item,baseDate,targetDate){\n  if(window.__ONEKAN_DAILY_FOCUS_MODE__)return targetDate===baseDate;\n  if(!baseDate||!targetDate)return false;'
          if old not in text and new not in text:
              raise SystemExit('unified recurrence target not found')
          text = text.replace(old, new, 1)
          unified.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('./js/app.js?v=38', './js/app.js?v=39')
          text = text.replace('./js/unified-workspace.js?v=62', './js/unified-workspace.js?v=63')
          text = text.replace('./js/daily-focus-mode.js?v=1', './js/daily-focus-mode.js?v=2')
          index.write_text(text)
          PY

      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/unified-workspace.js
          node --check js/daily-focus-mode.js

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js js/unified-workspace.js js/daily-focus-mode.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: remove remaining repeat behavior"
            git push origin main
          fi

      - name: Remove workflow
        if: always()
        run: |
          git pull --rebase origin main
          git rm .github/workflows/remove-repeat-ui.yml
          git commit -m "chore: remove repeat cleanup workflow"
          git push origin main
