name: Runtime asset audit once

on:
  push:
    branches:
      - chore/runtime-asset-audit-2

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit runtime asset reachability
        run: node scripts/runtime-asset-audit.mjs
