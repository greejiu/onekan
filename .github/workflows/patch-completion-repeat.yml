name: Patch completion repeat
on:
  push:
    paths:
      - '.github/workflows/patch-completion-repeat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node .github/scripts/patch-completion-repeat.mjs
      - name: Check JavaScript
        run: |
          node --check js/repeat-after-completion.js
          node --check js/unified-workspace.js
          node --check js/app.js
          node --check js/project-plan.js
          node --check js/repeat-overview.js
          node --check js/task-input-controls.js
          node --check js/habit-history-view.js
          node --check js/interaction-fixes.js
      - name: Diff check
        run: git diff --check
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js index.html
          git commit -m 'feat: repeat tasks after completion'
      - name: Remove patch files
        run: |
          rm .github/scripts/patch-completion-repeat.mjs .github/workflows/patch-completion-repeat.yml
          git add -A
          git commit -m 'chore: remove completion repeat patch files'
      - name: Push
        run: git push origin main
