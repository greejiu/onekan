name: Drag scope click guard
on:
  push:
    paths:
      - 'scripts/run-drag-scope-click-guard.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-drag-scope-click-guard.py
      - name: Check JS
        run: node --check js/unified-workspace.js
      - name: Regression
        run: node scripts/drag-scope-click-guard-regression.mjs
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/unified-workspace.js index.html
          git commit -m 'Fix recurring drag scope click suppression'
          git push
