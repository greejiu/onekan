name: Compact goal board layout

on:
  push:
    paths:
      - '.github/workflows/compact-goal-board.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch goal board
        run: python .github/scripts/compact_goal_board.py
      - name: Check JavaScript
        run: |
          node --check js/goal-board-v2.js
          node --check js/goal-quick-add.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/compact-goal-board.yml .github/scripts/compact_goal_board.py
          git add js/goal-board-v2.js js/goal-quick-add.js css/goal-board-v2.css js/interaction-fixes.js index.html
          git commit -m "feat: focus goal board on active work"
          git push origin main
