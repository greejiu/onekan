name: Add repeat overview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-repeat-overview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Add repeat navigation and page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old = '''        <button class="nav-item" data-page="tasks" type="button"><span class="nav-icon">✓</span><span class="nav-label">할일</span></button>
        <button class="nav-item" data-page="tracking" type="button"><span class="nav-icon">◷</span><span class="nav-label">시간추적</span></button>'''
          new = '''        <button class="nav-item" data-page="tasks" type="button"><span class="nav-icon">✓</span><span class="nav-label">할일</span></button>
        <button class="nav-item" data-page="repeat" type="button"><span class="nav-icon">↻</span><span class="nav-label">반복</span></button>
        <button class="nav-item" data-page="tracking" type="button"><span class="nav-icon">◷</span><span class="nav-label">시간추적</span></button>'''
          if old not in text:
              raise SystemExit('navigation token not found')
          text = text.replace(old, new, 1)

          marker = '''      <section class="page" id="page-tracking">'''
          repeat_page = '''      <section class="page" id="page-repeat">
        <div class="page-head"><div><h1 class="page-title">반복</h1></div></div>
        <p class="onekan-repeat-intro">반복되는 할일과 일정을 한 곳에서 확인해요. 지금은 기존 반복 항목을 모아보는 단계예요.</p>
        <div class="onekan-repeat-grid" id="repeatOverviewBody"></div>
      </section>

'''
          if marker not in text:
              raise SystemExit('repeat page marker not found')
          text = text.replace(marker, repeat_page + marker, 1)

          old_script = '''  <script type="module" src="./js/unified-workspace.js?v=67"></script>'''
          new_script = '''  <script type="module" src="./js/unified-workspace.js?v=67"></script>
  <script type="module" src="./js/repeat-overview.js?v=1"></script>'''
          if old_script not in text:
              raise SystemExit('script token not found')
          text = text.replace(old_script, new_script, 1)
          path.write_text(text)
          PY

      - name: Check JavaScript syntax
        run: node --check js/repeat-overview.js

      - name: Commit changes
        run: |
          rm .github/workflows/add-repeat-overview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-repeat-overview.yml
          git commit -m 'feat: add repeat overview tab'
          git push
