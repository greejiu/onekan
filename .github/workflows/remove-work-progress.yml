name: Remove work progress

on:
  push:
    paths:
      - '.github/workflows/remove-work-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove progress UI and logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          work_path = Path('js/work-management.js')
          work = work_path.read_text()

          # Remove legacy progress values whenever state is normalized.
          work = work.replace('    if (item.status === "done" && !item.completedAt) item.completedAt = new Date().toISOString();\n', '    if (item.status === "done" && !item.completedAt) item.completedAt = new Date().toISOString();\n    delete item.progress;\n')

          work, count = re.subn(
              r'\nfunction progressOf\(item\) \{\n  return Math\.max\(0, Math\.min\(100, Number\(item\.progress \|\| 0\)\)\);\n\}\n',
              '\n',
              work,
              count=1,
          )
          if count != 1:
              raise SystemExit('progressOf block not found')

          work, count = re.subn(
              r'function workRow\(item\) \{\n  const progress = progressOf\(item\);\n  return `(<article class="uw-work-row".*?<button class="uw-icon-btn" data-work-edit="\$\{item\.id\}" type="button" aria-label="수정">···</button></div>)<div class="uw-work-progress">.*?</div></article>`;\n\}',
              r'function workRow(item) {\n  return `\1</article>`;\n}',
              work,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('workRow progress markup not found')

          old = '  $("#projectProgress").value = String(Math.max(0, Math.min(100, Number(item?.progress || 0))));\n'
          if old not in work:
              raise SystemExit('dialog progress setter not found')
          work = work.replace(old, '')

          old = '      item.progress = 100;\n'
          if old not in work:
              raise SystemExit('done progress setter not found')
          work = work.replace(old, '')

          old = '      item.progress = Math.max(0, Math.min(100, Number($("#projectProgress").value || 0)));\n'
          if old not in work:
              raise SystemExit('submit progress setter not found')
          work = work.replace(old, '')

          work_path.write_text(work)

          index_path = Path('index.html')
          index = index_path.read_text()
          index, count = re.subn(
              r'\n\s*<div class="field"><label>진행률</label><input id="projectProgress" type="number" min="0" max="100" value="0" /><small>0~100 사이에서 직접 입력합니다\.</small></div>',
              '',
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit('project progress field not found')
          index = re.sub(r'\./js/work-management\.js\?v=\d+', './js/work-management.js?v=5', index, count=1)
          index_path.write_text(index)

          css_path = Path('css/unified-workspace.css')
          css = css_path.read_text()
          css = re.sub(r'\.uw-work-progress\{[^}]*\}\n?', '', css)
          css = re.sub(r'\.uw-work-progress span\{[^}]*\}\n?', '', css)
          css = css.replace('.uw-work-progress,.uw-work-links{margin-left:0}', '.uw-work-links{margin-left:0}')
          css_path.write_text(css)
          PY

          node --check js/work-management.js
          rm .github/workflows/remove-work-progress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove goal and work progress fields"
          git push
