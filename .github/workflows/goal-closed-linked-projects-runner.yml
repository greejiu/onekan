name: Goal closure patch runner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goal-closed-linked-projects-runner.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch-goal-closed-linked-projects.py
      - name: Validate JavaScript
        run: |
          node --check js/work-management.js
          node --check js/work-status-inline-add.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/work-management.js js/work-status-inline-add.js css/unified-workspace.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add goal closure and linked projects'
          git push
