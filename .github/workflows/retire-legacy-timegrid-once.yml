name: Retire legacy timegrid once

on:
  push:
    branches:
      - chore/remove-legacy-timegrid

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup
        run: node scripts/apply-legacy-timegrid-cleanup.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -maxdepth 1 -name '*.js' -print0 | sort -z)
      - name: Run regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in scripts/*-regression.mjs; do
            node "$test"
          done
          node scripts/unified-render-smoke.mjs
      - name: Commit cleanup result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html scripts/app-legacy-timeline-audit-regression.mjs claude/cleanup-notes.md
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "refactor: remove legacy app timegrid subsystem"
          git push origin HEAD:${GITHUB_REF_NAME}
