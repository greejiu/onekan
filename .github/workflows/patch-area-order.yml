name: Patch area order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-area-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          python3 scripts/patch-area-order.py
          node --check js/app.js
          git diff --check
      - name: Commit and clean patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js css/style.css index.html
          git commit -m 'feat: allow reordering settings areas'
          rm -f scripts/patch-area-order.py .github/workflows/patch-area-order.yml
          git add -A
          git commit -m 'chore: remove area order patch files'
          git push origin main
