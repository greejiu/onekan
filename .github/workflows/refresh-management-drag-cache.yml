name: Refresh management drag cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-management-drag-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump interaction fixes cache and clean workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = './js/interaction-fixes.js?v=6'
          new = './js/interaction-fixes.js?v=7'
          if old not in text:
              raise SystemExit('Expected interaction-fixes cache version not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/refresh-management-drag-cache.yml
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: load management item dragging"
          git push origin main

# Trigger refresh after workflow registration.
