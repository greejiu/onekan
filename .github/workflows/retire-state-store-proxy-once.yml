name: Retire state-store proxy once

on:
  push:
    branches:
      - refactor/retire-state-store-proxy

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply proxy retirement
        env:
          CACHE_BASE: origin/main
        run: node scripts/apply-retire-state-store-proxy.mjs
      - name: Validate
        run: |
          set -euo pipefail
          for file in js/*.js; do node --check "$file"; done
          for test in scripts/*-regression.mjs; do node "$test"; done
          node scripts/cache-buster-regression.mjs --check-diff origin/main
          node scripts/unified-render-smoke.mjs
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- scripts/apply-retire-state-store-proxy.mjs .github/workflows/retire-state-store-proxy-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: Supabase 호환 state-store Proxy 런타임 제거"
          git push origin HEAD:refactor/retire-state-store-proxy
