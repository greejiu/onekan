name: Time block V2 menu
on:
  push:
    paths:
      - 'scripts/patch-time-block-v2-menu.py'
      - 'scripts/time-block-v2-menu-regression.mjs'
      - '.github/workflows/time-block-v2-menu.yml'

permissions:
  contents: write

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply menu patch
        run: python scripts/patch-time-block-v2-menu.py
      - name: Check JavaScript
        run: node --check js/unified-workspace.js
      - name: Run menu regression
        run: node scripts/time-block-v2-menu-regression.mjs
      - name: Verify cache bumps
        run: |
          grep -q 'unified-workspace.css?v=34' index.html
          grep -q 'unified-workspace.js?v=40' index.html
      - name: Commit menu update
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/unified-workspace.js css/unified-workspace.css index.html
          git commit -m 'Refine time block V2 header menus'
          git push
