name: Area lists state-store migration once

on:
  push:
    branches:
      - refactor/area-lists-state-store

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration
        run: node scripts/apply-area-lists-state-store-migration.mjs
      - name: Bump cache versions
        run: node scripts/cache-buster-regression.mjs --bump js/task-area-list.js js/habit-area-list.js
      - name: Validate migration
        run: |
          set -euo pipefail
          node --check js/task-area-list.js
          node --check js/habit-area-list.js
          node scripts/area-lists-state-store-regression.mjs
          for test in scripts/*-regression.mjs; do node "$test"; done
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/task-area-list.js js/habit-area-list.js index.html js/*.js scripts/area-lists-state-store-regression.mjs
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "refactor: 영역별 목록을 공용 state-store로 이전"
          git push origin HEAD:refactor/area-lists-state-store
