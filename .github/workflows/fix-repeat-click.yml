name: Fix repeat click

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-repeat-click.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh repeat controls cache
        run: perl -0pi -e 's#\./js/interaction-fixes\.js\?v=33#./js/interaction-fixes.js?v=34#' index.html

      - name: Check JavaScript syntax
        run: |
          node --check js/interaction-fixes.js
          node --check js/task-input-controls.js

      - name: Commit changes
        run: |
          rm .github/workflows/fix-repeat-click.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-repeat-click.yml
          git commit -m 'fix: refresh repeat controls'
          git push