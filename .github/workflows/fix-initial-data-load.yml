name: Fix initial data load
on:
  push:
    paths:
      - '.github/workflows/fix-initial-data-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-initial-data-load.py
      - name: Syntax check
        run: node --check js/unified-workspace.js
      - name: Verify
        run: |
          grep -q 'if(!user){const {data:{session}}=await supabase.auth.getSession()' js/unified-workspace.js
          grep -q 'if(user)setTimeout(init,0)' js/unified-workspace.js
          grep -q 'unified-workspace.js?v=77' index.html
          ! grep -q 'queueMicrotask(init)' js/unified-workspace.js
      - name: Remove helpers
        run: rm -f .github/scripts/fix-initial-data-load.py .github/workflows/fix-initial-data-load.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore initial calendar data load' || exit 0
          git push
