name: Patch project area wording and cancel
on:
  push:
    paths:
      - '.github/workflows/patch-project-area.yml'
      - '.github/scripts/patch-project-area.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python3 .github/scripts/patch-project-area.py
          node --check js/project-status.js
          node --check js/context-menu.js
          git diff --check
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/project-status.js js/context-menu.js index.html
          git commit -m 'fix: unify project group wording as area' || exit 0
          git push
      - name: Remove patch files
        run: |
          git pull --rebase
          git rm .github/workflows/patch-project-area.yml .github/scripts/patch-project-area.py
          git commit -m 'chore: remove project area patch files'
          git push
