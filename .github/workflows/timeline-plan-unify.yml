name: Timeline plan unify
on:
  push:
    paths:
      - 'scripts/run-timeline-plan-unify.txt'
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-timeline-plan-unify.py
      - name: Check JS
        run: node --check js/unified-workspace.js
      - name: Regression
        run: node scripts/timeline-plan-unify-regression.mjs
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/unified-workspace.js css/unified-workspace.css index.html
          git commit -m 'Unify timeline planned item cards and drag'
          git push
