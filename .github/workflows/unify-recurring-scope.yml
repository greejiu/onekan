name: Unify recurring scope UX
on:
  push:
    branches: [main]
    paths:
      - 'scripts/unify-recurring-scope.py'
      - '.github/workflows/unify-recurring-scope.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/unify-recurring-scope.py
      - name: Validate JavaScript
        run: node --check js/unified-workspace.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/unified-workspace.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Unify recurring item scope controls'
          git push
