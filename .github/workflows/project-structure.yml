name: Project planning polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-structure.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Polish project planning
        run: python3 scripts/fix-project-planning.py
      - name: Validate JavaScript
        run: |
          node --check js/work-management.js
          node --check js/project-planning.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/work-management.js js/project-planning.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish project planning flow'
          git push
