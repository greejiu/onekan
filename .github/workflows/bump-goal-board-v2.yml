name: Bump goal board v2 cache
# trigger

on:
  push:
    paths:
      - '.github/workflows/bump-goal-board-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bump cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path('js/interaction-fixes.js')
          text = loader.read_text()
          text = text.replace('import "./goal-board-v2.js?v=1";', 'import "./goal-board-v2.js?v=2";')
          loader.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('./js/interaction-fixes.js?v=19', './js/interaction-fixes.js?v=20')
          index.write_text(text)
          PY
          node --check js/goal-board-v2.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-goal-board-v2.yml
          git add js/interaction-fixes.js index.html
          git commit -m "chore: refresh goal board cache"
          git push origin main
