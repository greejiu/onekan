name: Fix home right card scroll v2
on:
  push:
    paths:
      - '.github/scripts/fix-home-right-card-scroll-v2.py'
      - '.github/workflows/fix-home-right-card-scroll-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-home-right-card-scroll-v2.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('css/unified-workspace.css').read_text()
          index = Path('index.html').read_text()
          assert css.count('/* Home right cards: reliable half-height internal scrolling */') == 1
          assert 'grid-template-rows:auto minmax(0,1fr);' in css
          assert 'overflow-y:scroll;' in css
          assert 'fixed half-height scroll regions' not in css
          assert 'unified-workspace.css?v=57' in index
          PY
      - name: Remove helpers
        run: rm -f .github/scripts/fix-home-right-card-scroll-v2.py .github/workflows/fix-home-right-card-scroll-v2.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize home right card scrolling' || exit 0
          git push
