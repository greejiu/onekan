name: Remove goal and project UI

on:
  push:
    paths:
      - '.github/workflows/remove-goal-project-ui.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove goal and project surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text()

          text = text.replace('        <button class="nav-item" data-page="goals" type="button"><span class="nav-icon">◎</span><span class="nav-label">목표 현황</span></button>\n', '')
          text = text.replace('        <button class="nav-item" data-page="projects" type="button"><span class="nav-icon">▥</span><span class="nav-label">프로젝트 현황</span></button>\n', '')

          text, goal_count = re.subn(
              r'\n\s*<section class="page uw-work-page" id="page-goals">.*?</section>\n',
              '\n', text, count=1, flags=re.S
          )
          text, project_count = re.subn(
              r'\n\s*<section class="page uw-work-page" id="page-projects">.*?</section>\n',
              '\n', text, count=1, flags=re.S
          )
          text, dialog_count = re.subn(
              r'\n\s*<dialog id="projectDialog" class="app-dialog uw-work-dialog">.*?</dialog>\n',
              '\n', text, count=1, flags=re.S
          )
          if goal_count != 1 or project_count != 1 or dialog_count != 1:
              raise SystemExit(f'expected goal/project/dialog blocks once, got {goal_count}/{project_count}/{dialog_count}')

          text = text.replace('일정·할일·습관·목표·프로젝트현황에서 공통으로 사용하는 영역입니다.', '일정·할일·습관에서 공통으로 사용하는 영역입니다.')
          text = text.replace('  <script type="module" src="./js/work-management.js?v=12"></script>\n', '')
          text = text.replace('  <script type="module" src="./js/project-planning.js?v=5"></script>\n', '')
          text = text.replace('  <script type="module" src="./js/work-status-inline-add.js?v=5"></script>\n', '')
          text = text.replace('./js/interaction-fixes.js?v=25', './js/interaction-fixes.js?v=26')

          forbidden = ['data-page="goals"', 'data-page="projects"', 'id="page-goals"', 'id="page-projects"', 'id="projectDialog"', './js/work-management.js', './js/project-planning.js', './js/work-status-inline-add.js']
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit(f'goal/project UI leftovers in index: {leftovers}')
          index.write_text(text)

          fixes = Path('js/interaction-fixes.js')
          f = fixes.read_text()
          for line in [
              'import "./goal-board-v2.js?v=3";\n',
              'import "./goal-quick-add.js?v=3";\n',
              'import "./goal-group-board.js?v=2";\n',
              'import "./goal-status-drag.js?v=3";\n',
              'import "./goal-group-board.js?v=1";\n',
              'import "./goal-status-drag.js?v=2";\n',
          ]:
              f = f.replace(line, '')
          if 'goal-board-v2.js' in f or 'goal-quick-add.js' in f or 'goal-group-board.js' in f or 'goal-status-drag.js' in f:
              raise SystemExit('goal modules still loaded by interaction-fixes')
          fixes.write_text(f)
          PY
          node --check js/interaction-fixes.js
          grep -q 'data-page="home"' index.html
          grep -q 'data-page="calendar"' index.html
          grep -q 'data-page="tasks"' index.html
          grep -q 'data-page="habits"' index.html
          grep -q 'data-page="tracking"' index.html
          grep -q 'data-page="settings"' index.html
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-goal-project-ui.yml
          git add index.html js/interaction-fixes.js
          git commit -m "chore: hide goal and project features"
          git push origin main
