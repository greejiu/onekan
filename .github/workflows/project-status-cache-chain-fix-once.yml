name: Project status cache chain fix once

on:
  push:
    branches:
      - refactor/project-status-state-store

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/project-status-state-store
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cache chain fix
        run: node scripts/project-status-cache-chain-fix-once.mjs
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -maxdepth 1 -name '*.js' -print0 | sort -z)
          for test in scripts/*-regression.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done
          node scripts/cache-buster-regression.mjs --check-diff origin/main
          node scripts/unified-render-smoke.mjs
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: project status cache dependency versions 갱신"
          git push origin HEAD:refactor/project-status-state-store
