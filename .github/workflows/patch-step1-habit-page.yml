name: Patch step 1 habit page

on:
  push:
    paths:
      - '.github/workflows/patch-step1-habit-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node .github/scripts/patch-step1-habit-page.mjs
      - name: Check JavaScript
        run: node --check js/repeat-overview.js
      - name: Check diff
        run: git diff --check
      - name: Commit feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/repeat-overview.js
          git commit -m "feat: turn repeat management into habits"
          git push
      - name: Remove patch files
        run: |
          git rm .github/workflows/patch-step1-habit-page.yml .github/scripts/patch-step1-habit-page.mjs
          git commit -m "chore: remove step 1 habit page patch files"
          git push
