name: Enable goal board v2

on:
  push:
    paths:
      - '.github/workflows/enable-goal-board-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch loader and legacy goal migration
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path('js/interaction-fixes.js')
          text = loader.read_text()
          marker = 'import "./home-timeline-dynamic-columns.js?v=2";'
          addition = marker + '\nimport "./goal-board-v2.js?v=1";'
          if 'goal-board-v2.js' not in text:
              if marker not in text:
                  raise SystemExit('loader marker not found')
              text = text.replace(marker, addition, 1)
              loader.write_text(text)

          work = Path('js/work-management.js')
          text = work.read_text()
          old = '''    if (item.kind === "goal") {
              item.status = item.status === "done" ? "done" : item.status === "closed" ? "closed" : "doing";
              if (!["short", "long"].includes(item.goalTerm)) item.goalTerm = "short";
            } else if (!statusDefs.some((status) => status.id === item.status)) {
              item.status = "before";
            }'''
          new = '''    if (item.kind === "goal") {
              if (item.status === "closed") item.status = "archived";
              if (!["before", "doing", "done", "archived"].includes(item.status)) item.status = "doing";
              if (!["short", "long"].includes(item.goalTerm)) item.goalTerm = "short";
            } else if (!statusDefs.some((status) => status.id === item.status)) {
              item.status = "before";
            }'''
          if old in text:
              text = text.replace(old, new, 1)
              work.write_text(text)
          elif 'if (!["before", "doing", "done", "archived"].includes(item.status))' not in text:
              raise SystemExit('work-management migration marker not found')

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('./js/interaction-fixes.js?v=18', './js/interaction-fixes.js?v=19')
          index.write_text(text)
          PY
          node --check js/goal-board-v2.js
          node --check js/work-management.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-goal-board-v2.yml
          git add js/interaction-fixes.js js/work-management.js index.html
          git commit -m "feat: enable goal board v2"
          git push origin main
