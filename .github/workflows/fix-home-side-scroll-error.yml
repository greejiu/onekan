name: Fix home side scroll error
on:
  push:
    paths:
      - '.github/scripts/fix-home-side-scroll-error.py'
      - '.github/workflows/fix-home-side-scroll-error.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix-home-side-scroll-error.py
      - name: Verify
        run: |
          grep -q 'Home right cards: fixed half-height scroll regions' css/unified-workspace.css
          ! grep -q 'height:0!important' css/unified-workspace.css
          grep -q 'overflow-y:scroll;' css/unified-workspace.css
          grep -q 'unified-workspace.css?v=56' index.html
      - name: Remove helpers
        run: rm -f .github/scripts/fix-home-side-scroll-error.py .github/workflows/fix-home-side-scroll-error.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove broken zero-height side panel scroll' || exit 0
          git push
