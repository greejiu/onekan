name: Small state-store migration once

on:
  push:
    branches:
      - chore/state-store-final-audit

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migration and cache chain
        env:
          CACHE_BASE: origin/main
        run: node scripts/apply-small-state-store-migration.mjs
      - name: Validate migration
        run: |
          set -euo pipefail
          node --check js/appearance.js
          node --check js/load-recovery.js
          node --check js/project-period-popover.js
          for test in scripts/*-regression.mjs; do node "$test"; done
          node scripts/cache-buster-regression.mjs --check-diff origin/main
      - name: Commit migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/*.js css/*.css scripts/state-store-direct-access-regression.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: 남은 소형 상태 모듈을 공용 state-store로 이전"
          git push origin HEAD:chore/state-store-final-audit
