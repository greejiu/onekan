name: Enable management section context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-management-section-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire section context module
        run: |
          node --check js/management-section-context.js
          python - <<'PY'
          from pathlib import Path
          loader = Path('js/interaction-fixes.js')
          text = loader.read_text()
          anchor = 'import "./management.js?v=2";'
          line = 'import "./management-section-context.js?v=1";'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('management import anchor missing')
              text = text.replace(anchor, anchor + '\n' + line, 1)
              loader.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          old = './js/interaction-fixes.js?v=15'
          new = './js/interaction-fixes.js?v=16'
          if old in text:
              text = text.replace(old, new, 1)
              index.write_text(text)
          elif new not in text:
              raise SystemExit('interaction cache target missing')
          PY
          git rm .github/workflows/enable-management-section-context.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/interaction-fixes.js index.html
          git commit -m "feat: enable management section context menu"
          git push origin main

# trigger
