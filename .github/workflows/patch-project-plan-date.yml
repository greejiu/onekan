name: Patch project plan date and task project menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-project-plan-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/patch-project-plan-date.py
          node --check js/context-menu.js
          node --check js/project-plan.js
          git diff --check
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/context-menu.js js/project-plan.js index.html
          git commit -m 'feat: connect project planning dates to tasks'
      - name: Remove patch files
        run: |
          git rm scripts/patch-project-plan-date.py .github/workflows/patch-project-plan-date.yml
          git commit -m 'chore: remove project plan date patch files'
          git push origin main
# retry after cache marker correction
