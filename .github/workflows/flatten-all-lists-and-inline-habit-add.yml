name: Flatten all lists and inline habit add

on:
  push:
    paths:
      - ".github/workflows/flatten-all-lists-and-inline-habit-add.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI/list patch
        run: python3 scripts/flatten-all-lists-and-inline-habit-add.py
      - name: Syntax check
        run: |
          node --input-type=module --check < js/unified-workspace.js
          node --input-type=module --check < js/repeat-overview.js
      - name: Verify behavior markers
        run: |
          ! grep -q 'window.prompt("습관 이름")' js/repeat-overview.js
          grep -q 'openHabitInline' js/repeat-overview.js
          grep -q 'if(scheduleListTab==="all")' js/unified-workspace.js
          grep -q 'if(taskListTab==="all")' js/unified-workspace.js
          grep -q 'if(habitListTab==="all")' js/repeat-overview.js
          grep -q 'uw-flat-all-list' js/unified-workspace.js
          grep -q 'uw-flat-all-list' js/repeat-overview.js
          grep -q 'unified-workspace.js?v=74' index.html
          grep -q 'repeat-overview.js?v=8' index.html
      - name: Remove migration helpers
        run: |
          rm -f scripts/flatten-all-lists-and-inline-habit-add.py
          rm -f .github/workflows/flatten-all-lists-and-inline-habit-add.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: inline habit input and flatten all lists"
          git push origin HEAD:main
