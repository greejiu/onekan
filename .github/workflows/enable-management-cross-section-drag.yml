name: Enable management cross-section drag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-management-cross-section-drag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire cross-section drag
        run: |
          python - <<'PY'
          from pathlib import Path

          drag = Path('js/management-section-item-drag.js')
          text = drag.read_text()
          marker = 'const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];'
          esc_line = 'const esc = (value) => String(value ?? "").replace(/[&<>"\\\']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", \'"\': "&quot;", "\'": "&#039;" }[char]));'
          if 'const esc = (value)' not in text:
              text = text.replace(marker, marker + '\n' + esc_line, 1)
          text = text.replace('${String(group.name ?? "")}</button>', '${esc(group.name)}</button>', 1)
          drag.write_text(text)

          loader = Path('js/interaction-fixes.js')
          text = loader.read_text()
          anchor = 'import "./management-item-drag-fix.js?v=3";'
          line = 'import "./management-section-item-drag.js?v=1";'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('drag import anchor missing')
              text = text.replace(anchor, anchor + '\n' + line, 1)
              loader.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          if './js/interaction-fixes.js?v=17' in text:
              text = text.replace('./js/interaction-fixes.js?v=17', './js/interaction-fixes.js?v=18', 1)
              index.write_text(text)
          elif './js/interaction-fixes.js?v=18' not in text:
              raise SystemExit('interaction cache target missing')
          PY
          node --check js/management-section-item-drag.js
          git rm .github/workflows/enable-management-cross-section-drag.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/management-section-item-drag.js js/interaction-fixes.js index.html
          git commit -m "feat: enable management cross-section drag"
          git push origin main

# trigger
