name: Patch project plan date sort
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-project-plan-date-sort.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch-project-plan-date-sort.py
      - name: Check JS
        run: node --check js/project-plan.js
      - name: Check diff
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/project-plan.js index.html
          git commit -m "fix: sort project plan tasks by date" || true
          git rm .github/workflows/patch-project-plan-date-sort.yml scripts/patch-project-plan-date-sort.py
          git commit -m "chore: remove project plan sort patch files"
          git push origin main
