name: Time block V2 stage 1

on:
  push:
    paths:
      - 'js/time-block-v2.js'
      - 'js/time-block-v2-settings.js'
      - 'scripts/time-block-v2-stage1.mjs'
      - 'scripts/patch-time-block-v2-stage1.py'
      - '.github/workflows/time-block-v2-stage1.yml'

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: |
          node --check js/time-block-v2.js
          node --check js/time-block-v2-settings.js
      - name: Run versioning regression
        run: node scripts/time-block-v2-stage1.mjs
      - name: Patch index
        run: python scripts/patch-time-block-v2-stage1.py
      - name: Commit index wiring
        run: |
          if git diff --quiet -- index.html; then
            echo "index already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load time block V2 settings"
          git push
