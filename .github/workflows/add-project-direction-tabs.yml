name: Add project direction tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-project-direction-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch and validate
        run: |
          node --check js/project-direction-tabs.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<script type="module" src="./js/project-status.js?v=3"></script>'
          new = old + '\n  <script type="module" src="./js/project-direction-tabs.js?v=1"></script>'
          if './js/project-direction-tabs.js?v=1' not in s:
              if old not in s:
                  raise SystemExit('project-status script target not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: wire project direction tabs"
            git push
          fi
      - name: Remove workflow
        run: |
          git pull --rebase origin main
          rm .github/workflows/add-project-direction-tabs.yml
          git add .github/workflows/add-project-direction-tabs.yml
          git commit -m "chore: remove project direction tabs workflow"
          git push
