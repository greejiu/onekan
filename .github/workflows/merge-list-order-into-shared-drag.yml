name: Merge list ordering into shared drag

on:
  push:
    paths:
      - ".github/workflows/merge-list-order-into-shared-drag.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/merge-list-order-into-shared-drag.py
      - name: Syntax check
        run: |
          node --input-type=module --check < js/unified-workspace.js
          node --input-type=module --check < js/repeat-overview.js
      - name: Verify migration
        run: |
          ! grep -R "onekan-manual-handle\|data-manual-sort-handle\|manual-list-order.js" -n index.html js/unified-workspace.js js/repeat-overview.js || exit 1
          grep -q 'manual-order' js/unified-workspace.js
          grep -q 'manual-group' js/unified-workspace.js
          grep -q 'saveManualListOrder' js/unified-workspace.js
          grep -q 'uw-manual-drop-before' css/unified-workspace.css
      - name: Remove migration helpers
        run: |
          rm -f scripts/merge-list-order-into-shared-drag.py
          rm -f .github/workflows/merge-list-order-into-shared-drag.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: merge list ordering into shared drag"
          git push origin HEAD:main
