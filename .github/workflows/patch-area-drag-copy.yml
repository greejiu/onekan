name: Patch area drag copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-area-drag-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 scripts/patch-area-drag-copy.py
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'docs: describe area drag reorder'
          git push
      - run: |
          git pull --rebase
          rm -f scripts/patch-area-drag-copy.py .github/workflows/patch-area-drag-copy.yml
          git add -A
          git commit -m 'chore: remove area drag copy patch files'
          git push
