name: Audit direct onekan_state access once

on:
  push:
    branches:
      - chore/state-store-final-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit direct state access
        run: node scripts/audit-direct-onekan-state.mjs
      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude/state-store-direct-access-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record direct state access audit"
          git push origin HEAD:chore/state-store-final-audit
