name: Rename home views

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-home-views.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rename home views and set default
        run: |
          python - <<'PY'
          from pathlib import Path

          unified = Path('js/unified-workspace.js')
          text = unified.read_text()
          old = 'let user=null,state=null,homeDays=1,homeMode="timeline",homeSideTab="upcoming"'
          new = 'let user=null,state=null,homeDays=1,homeMode="list",homeSideTab="upcoming"'
          if old not in text:
              raise SystemExit('home mode token not found')
          unified.write_text(text.replace(old, new, 1))

          index = Path('index.html')
          text = index.read_text()
          replacements = {
              '<div class="uw-seg"><button data-uw-home-mode="list" type="button">목록</button><button class="active" data-uw-home-mode="timeline" type="button">타임블럭</button></div>': '<div class="uw-seg"><button class="active" data-uw-home-mode="list" type="button">타임블럭</button><button data-uw-home-mode="timeline" type="button">타임라인</button></div>',
              '<div class="card-header"><div class="card-title">오늘 타임블럭</div>': '<div class="card-header"><div class="card-title">오늘 계획</div>',
              './js/unified-workspace.js?v=65': './js/unified-workspace.js?v=66',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'index token not found: {old}')
              text = text.replace(old, new, 1)
          index.write_text(text)
          PY

      - name: Check JavaScript syntax
        run: node --check js/unified-workspace.js

      - name: Commit changes
        run: |
          rm .github/workflows/rename-home-views.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/unified-workspace.js .github/workflows/rename-home-views.yml
          git commit -m 'ui: distinguish time blocks and timeline'
          git push
