name: Finalize time block V2 stage 1

on:
  push:
    paths:
      - 'js/time-block-v2.js'
      - 'js/time-block-v2-settings.js'
      - 'scripts/finalize-time-block-v2-stage1.py'
      - '.github/workflows/finalize-time-block-v2-stage1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: |
          node --check js/time-block-v2.js
          node --check js/time-block-v2-settings.js
      - name: Bump cache version
        run: python scripts/finalize-time-block-v2-stage1.py
      - name: Commit cache bump
        run: |
          if git diff --quiet -- index.html; then
            echo "cache version already bumped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump time block V2 settings cache"
          git push
