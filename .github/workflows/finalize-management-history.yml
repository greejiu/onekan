name: Finalize management history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-management-history.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and isolate history interactions
        run: |
          node --check js/management-history.js
          python - <<'PY'
          from pathlib import Path

          drag = Path('js/management-item-drag-fix.js')
          text = drag.read_text()
          old = 'if (event.target.closest?.("[data-management-schedule-tool],.management-schedule-popover")) return;'
          new = 'if (event.target.closest?.("[data-management-schedule-tool],.management-schedule-popover,[data-management-history-open],.management-history-popover")) return;'
          if old in text:
              text = text.replace(old, new, 1)
              drag.write_text(text)
          elif new not in text:
              raise SystemExit('drag exclusion target not found')

          loader = Path('js/interaction-fixes.js')
          text = loader.read_text()
          old = 'import "./management-item-drag-fix.js?v=2";'
          new = 'import "./management-item-drag-fix.js?v=3";'
          if old in text:
              text = text.replace(old, new, 1)
              loader.write_text(text)
          elif new not in text:
              raise SystemExit('drag loader target not found')

          index = Path('index.html')
          text = index.read_text()
          old = './js/interaction-fixes.js?v=12'
          new = './js/interaction-fixes.js?v=13'
          if old in text:
              text = text.replace(old, new, 1)
              index.write_text(text)
          elif new not in text:
              raise SystemExit('interaction loader target not found')
          PY
          git rm .github/workflows/finalize-management-history.yml
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/management-item-drag-fix.js js/interaction-fixes.js index.html
          git commit -m "feat: finalize management history UI"
          git push origin main

# trigger
