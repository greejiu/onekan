name: Patch task project menu surfaces

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-task-project-menu-surfaces.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/patch-task-project-menu-surfaces.py
          node --check js/context-menu.js
          git diff --check
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/context-menu.js index.html
          git commit -m 'fix: show project menu for tasks across views'
      - name: Remove patch files
        run: |
          git rm scripts/patch-task-project-menu-surfaces.py .github/workflows/patch-task-project-menu-surfaces.yml
          git commit -m 'chore: remove task project menu surface patch files'
          git push origin main
