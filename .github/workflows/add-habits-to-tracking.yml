name: Add habits to tracking
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-habits-to-tracking.py'
      - '.github/workflows/add-habits-to-tracking.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/add-habits-to-tracking.py
      - name: Validate JavaScript
        run: node --check js/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show habits in time tracking'
          git push
