name: Refresh calendar marker fix

on:
  push:
    paths:
      - .github/workflows/bump-interaction-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump interaction fix cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = './js/interaction-fixes.js?v=5'
          new = './js/interaction-fixes.js?v=6'
          if old not in text:
              raise SystemExit('interaction-fixes v5 script reference not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/bump-interaction-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh calendar marker fix cache"
          git push
