name: Patch time record editing and date groups

on:
  push:
    paths:
      - '.github/workflows/patch-session-edit-and-groups.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch time tracking records
        run: |
          echo '  ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/context-menu.js
      - name: Commit patch
        run: |
          rm .github/workflows/patch-session-edit-and-groups.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Edit time records and group history by date"
          git push
