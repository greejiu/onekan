name: Goal horizon patch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-goal-horizon.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply goal horizon patch
        run: python3 scripts/patch-goal-horizon.py
      - name: Validate JavaScript
        run: |
          node --check js/work-management.js
          node --check js/work-status-inline-add.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/unified-workspace.css js/work-management.js js/work-status-inline-add.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Redesign goal horizon views'
          git push
