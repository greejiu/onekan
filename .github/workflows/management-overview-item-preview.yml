name: Management overview item preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/management-overview-item-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add compact item previews
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('js/management.js')
          text = js.read_text()

          text = text.replace('link.href = "./css/management.css?v=2";', 'link.href = "./css/management.css?v=3";', 1)

          old_counts = '''    const groupCount = managementState.managementGroups.filter((group) => group.sectionId === section.id).length;
    const itemCount = managementState.managementItems.filter((item) => item.sectionId === section.id).length;
    return `'''
          new_counts = '''    const groupCount = managementState.managementGroups.filter((group) => group.sectionId === section.id).length;
    const sectionItems = managementState.managementItems.filter((item) => item.sectionId === section.id);
    const itemCount = sectionItems.length;
    const previewItems = sectionItems.slice(0, 5);
    const remainingItems = Math.max(0, itemCount - previewItems.length);
    return `'''
          if old_counts not in text:
              raise SystemExit('section count block not found')
          text = text.replace(old_counts, new_counts, 1)

          old_body = '''        <div class="management-section-board-body">
          <span>${groupCount ? `${groupCount}개 그룹` : "그룹 없음"}</span>
          <small>${itemCount ? `${itemCount}개 항목` : "아직 관리 항목이 없어요."}</small>
        </div>'''
          new_body = '''        <div class="management-section-board-body">
          <div class="management-section-board-items">
            ${previewItems.length
              ? previewItems.map((item) => `<span class="management-section-board-item">${esc(item.title || "이름 없는 항목")}</span>`).join("")
              : '<span class="management-section-board-item-empty">아직 관리 항목이 없어요.</span>'}
            ${remainingItems ? `<small class="management-section-board-more">외 ${remainingItems}개</small>` : ""}
          </div>
          <small class="management-section-board-meta">${groupCount ? `${groupCount}개 그룹` : "그룹 없음"} · ${itemCount}개 항목</small>
        </div>'''
          if old_body not in text:
              raise SystemExit('section body block not found')
          text = text.replace(old_body, new_body, 1)
          js.write_text(text)

          css = Path('css/management.css')
          css_text = css.read_text()
          rules = '''.management-section-board-items{display:grid;gap:5px;min-height:0}.management-section-board-item{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text,#242424);font-size:13px;line-height:1.4}.management-section-board-item::before{content:"·";margin-right:6px;color:var(--muted,#858078)}.management-section-board-item-empty{font-size:12px;color:var(--muted,#858078)}.management-section-board-more{padding-left:12px;color:var(--muted,#858078);font-size:11px}.management-section-board-meta{margin-top:auto;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--border,#dedbd6) 70%,transparent);color:var(--muted,#858078)!important;font-size:11px!important}'''
          if '.management-section-board-items{' not in css_text:
              css.write_text(css_text + rules)

          loader = Path('js/interaction-fixes.js')
          loader_text = loader.read_text()
          if 'import "./management.js?v=2";' in loader_text:
              loader_text = loader_text.replace('import "./management.js?v=2";', 'import "./management.js?v=3";', 1)
              loader.write_text(loader_text)
          elif 'import "./management.js?v=3";' not in loader_text:
              raise SystemExit('management loader target missing')

          index = Path('index.html')
          index_text = index.read_text()
          if './js/interaction-fixes.js?v=16' in index_text:
              index_text = index_text.replace('./js/interaction-fixes.js?v=16', './js/interaction-fixes.js?v=17', 1)
              index.write_text(index_text)
          elif './js/interaction-fixes.js?v=17' not in index_text:
              raise SystemExit('interaction loader target missing')
          PY
          node --check js/management.js
          git rm .github/workflows/management-overview-item-preview.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/management.js css/management.css js/interaction-fixes.js index.html
          git commit -m "feat: show management item previews in overview"
          git push origin main

# trigger
